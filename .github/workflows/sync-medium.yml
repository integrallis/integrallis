name: Sync Medium articles

on:
  schedule:
    - cron: "17 15 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build article data
        run: python scripts/sync_medium.py
      - name: Commit feed changes
        run: |
          if git diff --quiet -- docs/assets/data/articles.json; then
            echo "Article feed is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/data/articles.json
          git commit -m "content: sync Medium articles"
          git push
