name: Sync Medium articles

on:
  schedule:
    - cron: "17 15 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build article data
        run: python scripts/sync_medium.py
      - name: Open a pull request if the feed moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- docs/assets/data/articles.json docs/writing.html; then
            echo "Article feed is already current."
            exit 0
          fi

          BRANCH="content/medium-sync-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add docs/assets/data/articles.json docs/writing.html
          git commit -m "content: sync Medium articles"
          git push --force-with-lease origin "$BRANCH"

          # main requires a reviewed pull request, so the sync proposes rather than pushes
          if gh pr view "$BRANCH" >/dev/null 2>&1; then
            echo "Pull request already open for $BRANCH."
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "content: sync Medium articles" \
              --body "Automated sync of the Medium feed into \`docs/assets/data/articles.json\` and the no-JS fallback cards in \`docs/writing.html\`.

          Generated by \`scripts/sync_medium.py\`; every field comes from the RSS feed."
          fi
